name: Enterprise Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Infrastructure Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate -no-color

      - name: Validate YAML and dashboard JSON
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          files = [
              ".github/workflows/ci-cd.yml",
              "docker/swarm/stack.yml",
              "monitoring/prometheus/prometheus.yml",
              "monitoring/grafana/provisioning/datasources/prometheus.yml",
              "monitoring/grafana/provisioning/dashboards/dashboard.yml",
          ]

          for filename in files:
              with open(filename, encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"Valid YAML: {filename}")

          dashboard = Path("monitoring/grafana/dashboards/enterprise-overview.json")
          with dashboard.open(encoding="utf-8") as stream:
              json.load(stream)
          print(f"Valid JSON: {dashboard}")
          PY

      - name: Validate Docker Swarm stack configuration
        working-directory: docker/swarm
        run: docker stack config --compose-file stack.yml
